name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.81.0
    - name: Install target
      run: rustup target add ${{ matrix.target }} || true
    - name: Build release binary
      run: |
        mkdir -p dist/${{ matrix.target }}
        cargo build --release --target ${{ matrix.target }} || true
        # Copy top-level binaries if present (workspace may expose different binary names)
        cp -a target/${{ matrix.target }}/release/* dist/${{ matrix.target }}/ 2>/dev/null || true
    - name: Upload artifact for release
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.target }}
        path: dist/${{ matrix.target }}
        if-no-files-found: ignore

  publish-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v4
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist/

    - name: Generate changelog snippet
      id: changelog
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
        if [ -n "$PREV_TAG" ]; then
          echo "Generating changelog from $PREV_TAG..$TAG"
          git log --pretty=format:"- %s (%an)" "$PREV_TAG..$TAG" > /tmp/changelog.txt || touch /tmp/changelog.txt
        else
          echo "No previous tag found; using latest commits"
          git log -n 50 --pretty=format:"- %s (%an)" > /tmp/changelog.txt || touch /tmp/changelog.txt
        fi
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        cat /tmp/changelog.txt >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Package per-target archives
      run: |
        set -euo pipefail
        cd dist
        for d in */ ; do
          t=${d%/}
          zipfile="${t}.zip"
          echo "Packaging $d -> $zipfile"
          if [ -d "$d" ]; then
            zip -r "$zipfile" "$d" || touch "$zipfile"
          fi
        done

    - name: Create GitHub Release and upload assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          Changelog (auto-generated):

          ${{ steps.changelog.outputs.changelog }}
        draft: false
        prerelease: false
        files: dist/**/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
