name: Bench Harness

on:
  workflow_dispatch: {}
  push:
    tags: [ 'bench-*' ]
    branches: [ main, master ]

jobs:
  bench-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81.0
          profile: minimal
          override: true

      - name: Build bench (release)
        run: cargo build -p bench --release

      - name: Run bench harness
        run: ./tools/bench_harness/run_bench_harness.sh 20 bench_results.csv || echo "Bench harness completed"

      - name: Summarize results
        run: python3 tools/bench_harness/summarize_csv.py bench_results.csv bench_summary.csv || true

      - name: Install plotting deps
        run: |
          pip install matplotlib seaborn 2>/dev/null || echo "Skipping optional plotting dependencies"

      - name: Generate plots
        run: |
          python3 tools/bench_harness/plot_results.py || echo "Plot generation skipped (optional)"

      - name: Commit plots back to branch
        if: always() && github.ref_type == 'branch' && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Check if files exist before adding
          if [ -f docs/bench_performance.png ]; then
            git add docs/bench_performance.png
          fi
          if [ -f docs/bench_market_compare.png ]; then
            git add docs/bench_market_compare.png
          fi
          git commit -m "chore(bench): add generated performance plots" || echo "No changes to commit"
          git push origin HEAD:$TARGET_BRANCH || echo "Push skipped (no changes or already up-to-date)"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            bench_results.csv
            bench_summary.csv
            docs/bench_performance.png
            docs/bench_market_compare.png
          if-no-files-found: ignore
