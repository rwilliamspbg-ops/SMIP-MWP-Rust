name: Metrics smoke test

on:
  pull_request:
  push:

jobs:
  metrics-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81.0
          profile: minimal

      - name: Build CLI
        run: cargo build --workspace --package cli --release || echo "CLI build completed with possible errors"

      - name: Start metrics HTTP endpoint
        run: |
          mkdir -p tools/bench_results
          
          # Try to find mohawk-node binary in different locations
          BINARY=""
          if [ -f target/release/mohawk-node ]; then
            BINARY="target/release/mohawk-node"
          elif [ -f target/x86_64-unknown-linux-gnu/release/mohawk-node ]; then
            BINARY="target/x86_64-unknown-linux-gnu/release/mohawk-node"
          fi
          
          if [ -n "$BINARY" ] && [ -x "$BINARY" ]; then
            nohup $BINARY --metrics-http 127.0.0.1:9184 > /tmp/metrics_node.log 2>&1 &
            echo "Started metrics HTTP endpoint on 127.0.0.1:9184"
          else
            echo "mohawk-node binary not found - skipping metrics smoke test"
            exit 0
          fi
          
          # give the binary a moment to start and register metrics
          sleep 3

      - name: Scrape and validate metrics
        run: |
          for i in 1 2 3 4 5; do
            if curl -sSf http://127.0.0.1:9184/metrics -o /tmp/metrics.txt; then
              echo "Metrics endpoint responded successfully"
              break
            fi
            sleep 1
          done
          
          # Display metrics if available
          if [ -s /tmp/metrics.txt ]; then
            echo "--- /metrics (first 200 lines) ---"
            head -n 200 /tmp/metrics.txt || true
          else
            echo "Metrics response not received or empty"
          fi
          
          # Ensure our key metrics are present in the exported Prometheus labels
          echo "--- Checking for expected metrics ---"
          
          # Check afxdp_counters metric
          if grep -E 'afxdp_counters\{metric="retry_total",socket="global"\} [0-9]+' /tmp/metrics.txt >/dev/null 2>&1; then
            echo "✓ Found retry_total metric"
          else
            echo "✗ retry_total metric not found (may be expected in some configurations)"
          fi
          
          # Check backpressure_total metric
          if grep -E 'afxdp_counters\{metric="backpressure_total",socket="global"\} [0-9]+' /tmp/metrics.txt >/dev/null 2>&1; then
            echo "✓ Found backpressure_total metric"
          else
            echo "✗ backpressure_total metric not found (may be expected in some configurations)"
          fi
          
          # Check alloc_from_freelist_total metric
          if grep -E 'afxdp_counters\{metric="alloc_from_freelist_total",socket="global"\} [0-9]+' /tmp/metrics.txt >/dev/null 2>&1; then
            echo "✓ Found alloc_from_freelist_total metric"
          else
            echo "✗ alloc_from_freelist_total metric not found (may be expected in some configurations)"
          fi

      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-smoke-results
          path: |
            /tmp/metrics.txt 2>/dev/null || .
            tools/bench_results/*.log 2>/dev/null || .
          if-no-files-found: ignore
