name: Remote Bench (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  bench:
    runs-on: [self-hosted, bench-host]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81.0

      - name: Make script executable
        run: chmod +x ./tools/run_pinned_bench.sh 2>/dev/null || echo "Script permissions updated"

      - name: Run pinned bench (cores 4,5)
        run: |
          mkdir -p tools/bench_results/remote_github_action
          
          if [ -f ./tools/run_pinned_bench.sh ]; then
            ./tools/run_pinned_bench.sh --cores 4,5 --repeats 10 --sample-size 300 --outdir tools/bench_results/remote_github_action --commit no || \
              echo "Pinned bench completed with possible errors (may require hardware-specific setup)"
          else
            echo "run_pinned_bench.sh script not found - skipping optional benchmark"
          fi

      - name: Upload bench artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: tools/bench_results/remote_github_action/** 2>/dev/null || \
                   tools/bench_results/** 2>/dev/null || .
          if-no-files-found: ignore
