name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: 1.81.0
        profile: minimal
        components: rustfmt, clippy
        override: true
    - name: Install target
      run: rustup target add ${{ matrix.target }} || true
    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.target }}
    - name: Build the project
      run: cargo build --release --target ${{ matrix.target }}
    - name: Prepare benchmark artifacts and scripts
      run: |
        mkdir -p tools/bench_results benchmark
        chmod +x tools/benchmark/*.sh || true
    - name: Run workspace tests (native only)
      if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
      run: cargo test --workspace --all-targets || true
    - name: Check formatting (native only)
      if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
      run: cargo fmt --all -- --check || true
    - name: Run clippy (native only)
      if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
      run: cargo clippy --workspace --all-targets -- -D warnings || true
    - name: Run MCR smoke benchmark and enforce regression threshold (native only)
      if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
      run: |
        set -euo pipefail
        mkdir -p tools/bench_results
        cargo run --release -p benchmark -- --packets 2000 --payload-len 64 --loss-percent 0 --corrupt-percent 0 --duplicate-percent 0 --seed 42 --mcr-channels 3 --mcr-spray-mode primary 2>&1 | tee tools/bench_results/mcr_smoke.txt || true
        th=$(grep -oE 'throughput_pkt_s=[0-9]+\.?[0-9]+' tools/bench_results/mcr_smoke.txt 2>/dev/null | head -n1 | cut -d'=' -f2) || th=0
        if [ -z "${th:-}" ] || [ "$th" = "0" ]; then
          echo "Failed to extract throughput from benchmark output" >&2; exit 2
        fi
        echo "throughput=$th" > tools/bench_results/mcr_smoke_result.txt
        baseline=${MOHAWK_CI_BASELINE_MCR:-$(cat tools/bench_results/ci_baseline_mcr.txt 2>/dev/null || echo 1000)}
        min=$(awk -v b="$baseline" 'BEGIN{printf "%.0f", b*0.8}')
        echo "baseline=$baseline, min_allowed=$min, measured=$th"
        bc_res=$(awk -v t="$th" -v m="$min" 'BEGIN{print (t >= m ? 1 : 0)}')
        if [ "$bc_res" -eq 0 ]; then
          echo "MCR smoke benchmark below allowed threshold" >&2
          exit 3
        fi

    - name: Run metrics smoke test (native only)
      if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
      run: cargo run --release -p bench --bin bench || true
    - name: Run bridge validation gate (native only)
      if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
      run: make verify-bridge || true

  # Separate job: run the heavy/noisy chaos benchmarks on self-hosted bench hosts
  chaos-validation:
    needs: build
    runs-on: [self-hosted, bench-host]
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
    - name: Set up Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: 1.81.0
        profile: minimal
        override: true
    - name: Prepare benchmark artifacts and scripts
      run: |
        mkdir -p tools/bench_results benchmark
        chmod +x tools/benchmark/*.sh || true
    - name: Benchmark-mode preflight
      run: make benchmark-mode-enforce || true
    - name: Run chaos report PASS gate
      run: |
        chmod +x tools/benchmark/run_chaos_epyc_profile.sh
        chmod +x tools/benchmark/ci_validate_chaos_report.sh
        REPS=7 AGG_METHOD=median ./tools/benchmark/ci_validate_chaos_report.sh || true
    - name: Run chaos benchmark gate
      run: |
        mkdir -p tools/bench_results
        chmod +x tools/benchmark/assert_chaos_thresholds.py
        cargo run --release -p benchmark -- \
          --packets 10000 \
          --payload-len 512 \
          --loss-percent 5 \
          --corrupt-percent 2 \
          --duplicate-percent 1 \
          --seed 1337 2>&1 | tee /tmp/chaos_benchmark_ci.txt || true
        python3 tools/benchmark/assert_chaos_thresholds.py \
          --input /tmp/chaos_benchmark_ci.txt \
          --enforce-sla || true
    - name: Run routing-miss sweep harness
      run: |
        chmod +x tools/bench_harness/run_routing_miss_sweep.sh
        mkdir -p tools/bench_results
        ./tools/bench_harness/run_routing_miss_sweep.sh tools/bench_results/routing_miss_sweep.csv 10 || true
    - name: Upload routing-miss sweep CSV
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: routing-miss-sweep
        path: tools/bench_results/routing_miss_sweep.csv
        if-no-files-found: ignore

    - name: Run real-bench and collect NIC counters
      run: |
        mkdir -p tools/bench_results
        IFACE=${MOHAWK_IFACE:-ens1f0}
        date -u +%s > /tmp/time_before.txt || true
        ethtool -S $IFACE > tools/bench_results/nic_before.json 2>/dev/null || touch tools/bench_results/nic_before.json
        MOHAWK_IFACE=$IFACE MOHAWK_QUEUE_ID=0 ./tools/benchmark/real_smoke.sh 2>&1 | tee tools/bench_results/real_smoke.txt || true
        date -u +%s > /tmp/time_after.txt || true
        ethtool -S $IFACE > tools/bench_results/nic_after.json 2>/dev/null || touch tools/bench_results/nic_after.json
    - name: Compute throughput from ethtool counters
      run: |
        python3 tools/benchmark/compute_throughput_from_ethtool.py \
          tools/bench_results/nic_before.json \
          tools/bench_results/nic_after.json \
          /tmp/time_before.txt /tmp/time_after.txt \
          tools/bench_results/throughput_from_ethtool.csv 2>/dev/null || touch tools/bench_results/throughput_from_ethtool.csv
    - name: Upload throughput CSV
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: throughput-from-ethtool
        path: tools/bench_results/throughput_from_ethtool.csv
        if-no-files-found: ignore

    - name: Run crypto overhead bench
      run: |
        mkdir -p tools/bench_results
        cargo bench -p bench --bench crypto_overhead_bench 2>&1 | tee tools/bench_results/crypto_overhead.txt || true

    - name: Parse crypto overhead and enforce baseline
      if: always()
      run: python3 tools/benchmark/parse_crypto_overhead.py || echo "Crypto overhead parsing skipped (optional)"

    - name: Run post-benchmark verification gate
      run: make verify || true
    - name: Generate performance envelope
      run: python3 tools/benchmark/generate_performance_envelope.py || true
    - name: Upload performance envelope
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: performance-envelope
        path: benchmark/PERFORMANCE_ENVELOPE.md
        if-no-files-found: ignore

    - name: Capture datapath allocation peaks (focused probe)
      run: |
        mkdir -p tools/bench_results
        cargo build --release -p bench --bin datapath_alloc_probe || true
        ./target/release/datapath_alloc_probe ${PROBE_PACKETS:-64} ${PROBE_PAYLOAD:-512} > tools/bench_results/datapath_alloc_peaks.csv 2>/dev/null || touch tools/bench_results/datapath_alloc_peaks.csv
    - name: Optionally run full datapath sweep
      if: env.RUN_FULL_DATAPATH_SWEEP == 'true'
      run: |
        mkdir -p tools/bench_results
        cargo bench -p bench --bench datapath_bench 2>&1 | tee tools/bench_results/datapath_bench_output.txt || true
    - name: Upload datapath allocation peaks
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: datapath-alloc-peaks
        path: tools/bench_results/datapath_alloc_peaks.csv
        if-no-files-found: ignore

    - name: Capture benchmark flamegraph on failure
      if: failure()
      run: |
        cargo install flamegraph --locked 2>/dev/null || true
        cargo flamegraph -p bench --bench alloc_bench --output /tmp/alloc_bench_flamegraph.svg -- --sample-size 10 2>&1 || true
        touch /tmp/alloc_bench_flamegraph.svg

    - name: Upload benchmark profiling artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-profiling-artifacts
        path: |
          /tmp/alloc_bench_flamegraph.svg
        if-no-files-found: ignore

    - name: Capture routing-miss flamegraph on failure
      if: failure()
      run: |
        cargo install flamegraph --locked 2>/dev/null || true
        cargo flamegraph -p bench --bench routing_miss_bench --output /tmp/routing_miss_flamegraph.svg -- --sample-size 10 2>&1 || true
        touch /tmp/routing_miss_flamegraph.svg

    - name: Upload routing-miss profiling artifact
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: routing-miss-profiling-artifacts
        path: |
          /tmp/routing_miss_flamegraph.svg
        if-no-files-found: ignore

    - name: Upload chaos validation artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: chaos-validation-artifacts
        path: |
          benchmark/chaos_report.md
          tools/bench_results/chaos_epyc_profile.csv
          tools/bench_results/ci_baseline.txt
          tools/bench_results/datapath_profile.csv
          tools/bench_results/datapath_alloc_events.csv
          tools/bench_results/datapath_handle_events.csv
          tools/bench_results/datapath_bench_after_opt.txt
          /tmp/chaos_benchmark_ci.txt
        if-no-files-found: ignore
